[project]
name = "memoria"
version = "0.1.0"
description = "Voice-first sales engineer agent for any company and product, with per-tenant memory."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.125.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "markdown>=3.7",
    "reportlab>=4.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "jsonschema>=4.20",
]

[project.scripts]
memoria = "memoria.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Anthropic API (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/memoria/chain_prompts.py" = ["E501"]
